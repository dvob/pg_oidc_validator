apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: dvob/postgres-oidc
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "system:serviceaccount:default:myapp"
        - name: POSTGRES_PASSWORD
          value: "apppw"
        - name: POSTGRES_DB
          value: "myapp"
        - name: ISSUER_URL
          value: "https://kubernetes.default.svc.cluster.local"
        - name: POSTGRES_HOST_AUTH_METHOD
          value: "oauth validator=oidc_validator issuer=$(ISSUER_URL) scope="
        args:
        - "-c"
        - "oauth_validator_libraries=oidc_validator"
        - "-c"
        - "log_connections=all"
        volumeMounts:
        - name: ca-certificates
          mountPath: /etc/ssl/certs/ca-certificates.crt
          subPath: ca.crt
          readOnly: true
      volumes:
      - name: ca-certificates
        configMap:
          name: kube-root-ca.crt
